name: Publish package

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.ref_protected
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify release is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: ./gradlew check cyclonedxBom publish
